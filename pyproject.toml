[project]
name = "hscup-vlsi-floorplanning"
version = "0.1.0"
description = "2026 华数杯 B 题 VLSI 布图规划建模与实验"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ortools>=9.14,<10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

